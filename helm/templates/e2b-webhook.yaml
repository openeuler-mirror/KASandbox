{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2b-webhook
  namespace: e2b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2b-webhook
  namespace: e2b
  labels:
    app.kubernetes.io/name: e2b-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: e2b-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2b-webhook
    spec:
      serviceAccountName: e2b-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/{{ .Values.api.pool }}
                    operator: Exists
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2b-webhook
                topologyKey: kubernetes.io/hostname
      containers:
        - name: e2b-webhook
          image: "{{ .Values.registry }}/{{ .Values.image.webhook }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: webhook
              containerPort: 8443
              protocol: TCP
          env:
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: PORT
              value: "8443"
            - name: E2B_API_URL
              value: "http://api.e2b.svc.cluster.local:{{ .Values.apiPort }}"
            - name: E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e2b-api-key
                  key: api-key
                  optional: {{ not (dig "agentenv" "enabled" false .Values.webhook) }}
            - name: E2B_API_TIMEOUT
              value: "4s"
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: e2b-webhook-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e2b-webhook
  namespace: e2b
  labels:
    app.kubernetes.io/name: e2b-webhook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2b-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: e2b-webhook
  namespace: e2b
spec:
  selector:
    app.kubernetes.io/name: e2b-webhook
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
---
# MutatingWebhookConfiguration: 拦截 Pod 与 BatchSandbox 的 CREATE。
# caBundle 由 deploy/deploy.sh 在 helm install 后注入 (占位为空)。
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: e2b-webhook
  labels:
    app.kubernetes.io/name: e2b-webhook
webhooks:
  - name: pod.e2b-webhook.e2b.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        name: e2b-webhook
        namespace: e2b
        path: /mutate
        port: 443
      caBundle: ""                 # 由 deploy/deploy.sh 注入
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "*"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "e2b"]
    objectSelector:                # 只处理由 BatchSandbox 控制器创建的 spotbox pod
      matchExpressions:
        - key: batch-sandbox.sandbox.opensandbox.io/pod-index
          operator: Exists
  - name: batchsandbox.e2b-webhook.e2b.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore          # CRD 缺失时不阻塞其它资源
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        name: e2b-webhook
        namespace: e2b
        path: /mutate
        port: 443
      caBundle: ""                 # 由 deploy/deploy.sh 注入
    rules:
      - apiGroups: ["sandbox.opensandbox.io"]
        apiVersions: ["v1alpha1"]
        resources: ["batchsandboxes"]
        operations: ["CREATE"]
        scope: "*"
{{- if dig "agentenv" "enabled" false .Values.webhook }}
{{- if not (semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version) }}
{{- fail "AgentENV admission requires Kubernetes >= 1.30 for stable matchConditions" }}
{{- end }}
  # AgentENV Pod 无法通过 label objectSelector 识别 runtimeClassName，使用 CEL 精确匹配。
  # failurePolicy=Ignore 保持 Webhook fail-open，最终由 agentenv-engine 对模板契约 fail-closed。
  - name: agentenv-pod.e2b-webhook.e2b.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        name: e2b-webhook
        namespace: e2b
        path: /mutate
        port: 443
      caBundle: ""                 # 由 deploy/deploy.sh 注入
    matchConditions:
      - name: agentenv-runtime-class
        expression: >-
          has(object.spec.runtimeClassName) &&
          object.spec.runtimeClassName == 'agentenv' &&
          (!has(object.metadata.labels) ||
           !('batch-sandbox.sandbox.opensandbox.io/pod-index' in object.metadata.labels))
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "*"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "e2b"]
{{- end }}
{{- end }}
