apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: agentenv-webhook
webhooks:
  - name: agentenv-pod.e2b-webhook.e2b.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        name: e2b-webhook
        namespace: e2b
        path: /mutate
        port: 443
      caBundle: ""                 # 由 AgentENV 独立安装脚本注入
    matchConditions:
      - name: agentenv-runtime-class
        expression: >-
          has(object.spec.runtimeClassName) &&
          object.spec.runtimeClassName == 'agentenv' &&
          (!has(object.metadata.labels) ||
           !('batch-sandbox.sandbox.opensandbox.io/pod-index' in object.metadata.labels))
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "*"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "e2b"]
