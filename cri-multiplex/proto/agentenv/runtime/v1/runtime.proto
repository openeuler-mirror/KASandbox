syntax = "proto3";

package agentenv.runtime.v1;

// AgentENV 低级运行时内部契约。
//
// 该文件只描述 AgentENV Runtime 与 agentenv-bridge/内部客户端之间的契约，
// 不是 KASandbox 的 Admin v2 公共契约。外部调用方不得直接依赖本文件。
//
// ID 语义：
// - native_sandbox_id：AgentENV 原生 UUID，是 VM/metadata/artifact 的权威身份。
// - product_sandbox_id：KASandbox 产品逻辑 ID，只用于关联和展示，不参与 VM 身份。
// - cri_sandbox_id：属于 KASandbox/CRI 层，不进入本契约。
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// SandboxPhase 是 AgentENV Runtime 对外投影的稳定生命周期阶段。
enum SandboxPhase {
  SANDBOX_PHASE_UNSPECIFIED = 0;
  CREATING = 1;
  RESUMING = 2;
  RUNNING = 3;
  PAUSING = 4;
  PAUSED = 5;
  SNAPSHOTTING = 6;
  DELETING = 7;
  FAILED = 8;
  NOT_FOUND = 9;
}

// SandboxSource 表示创建来源，template 与 image 必须二选一。
message SandboxSource {
  oneof kind {
    TemplateSource template = 1;
    ImageSource image = 2;
  }
}

message TemplateSource {
  // canonical templateID 或已解析的 READY template ID。
  string template_id = 1;
  // 可选构建标识；不得替代 template_id。
  string build_id = 2;
}

message ImageSource {
  // 已解析或可解析的 OCI image reference。
  string image = 1;
}

message ResourceSpec {
  int64 vcpu = 1;
  int64 memory_mb = 2;
  int64 disk_mb = 3;
}

message AutoResumeConfig {
  bool enabled = 1;
}

message VolumeMount {
  string id = 1;
  string name = 2;
  string path = 3;
  string type = 4;
}

message AttachedDrive {
  string drive_id = 1;
  string image = 2;
  bool read_only = 3;
  string mount_path = 4;
  string sub_path = 5;
  int64 disk_size_mb = 6;
}

message NetworkPolicy {
  // 为空表示由节点/模板默认策略决定。
  repeated string allowed_cidrs = 1;
  repeated string denied_cidrs = 2;
  repeated string allowed_domains = 3;
  optional bool allow_public_traffic = 4;
  optional string mask_request_host = 5;
}

// RuntimeNetworkMode 区分 Runtime 自管网络与 CRI/CNI 提供的外部 netns。
enum RuntimeNetworkMode {
  RUNTIME_NETWORK_MODE_UNSPECIFIED = 0;
  RUNTIME_NETWORK_MODE_RUNTIME_MANAGED = 1;
  RUNTIME_NETWORK_MODE_CNI_EXTERNAL_NETNS = 2;
}

// RuntimeNetworkConfig 由 agentenv-engine 填写，描述 CRI/CNI 已创建的网络事实。
// Runtime 只借用 external netns 创建 tap 和 VM 内部转发表，不拥有、不删除该 netns。
message RuntimeNetworkConfig {
  RuntimeNetworkMode mode = 1;
  // external netns 的绝对路径，必须已存在且由 agentenv-engine 持有生命周期。
  string netns_path = 2;
  // CNI 在 netns 内创建的主接口名，例如 eth0。
  string if_name = 3;
  // CNI 分配给 Pod 的 IPv4 地址，用作 Runtime 对外 HostIP。
  string pod_ip = 4;
  // 可选 CNI 网关，仅用于诊断和一致性校验。
  string gateway = 5;
  // 可选 DNS 列表；Runtime 使用其中第一个 IPv4 地址配置 guest。
  repeated string dns_servers = 6;
  // 可选 tap MTU；0 表示使用 Runtime/模板默认值。
  uint32 mtu = 7;
}

message AccessDescriptor {
  string node_proxy_url = 1;
  uint32 envd_port = 2;
  map<string, string> routing_headers = 3;
  // 只返回短期令牌引用，不返回长期明文 token。
  string token_ref = 4;
  string access_model = 5;
}

// SandboxSpec 是创建请求的完整业务描述。
message SandboxSpec {
  // 为空时由 Runtime 生成 UUID；非空时必须使用 UUID 格式并作为幂等身份。
  string native_sandbox_id = 1;
  // 仅用于关联 KASandbox 产品 ID；不得作为 native_sandbox_id。
  string product_sandbox_id = 2;
  string alias = 3;
  SandboxSource source = 4;
  ResourceSpec resources = 5;
  uint64 max_sandbox_length_hours = 6;
  optional bool allow_internet = 7;
  optional bool secure = 8;
  // CRI sandbox 必须传 false；true 仅允许原生路径。
  optional bool auto_pause = 9;
  AutoResumeConfig auto_resume = 10;
  map<string, string> env_vars = 11;
  map<string, string> metadata = 12;
  repeated VolumeMount volume_mounts = 13;
  NetworkPolicy network = 14;
  map<string, string> extra = 15;
  // opaque JSON object；空字符串等价于未设置。
  string custom_extension_params_json = 16;
  repeated AttachedDrive attached_drives = 17;
  string extra_boot_args = 18;
  // 可选绝对过期时间；外部 Admin v2 的 end_time 映射到该字段。
  google.protobuf.Timestamp expires_at = 19;
  // CRI/CNI 网络事实；为空表示 Runtime 自管网络。
  RuntimeNetworkConfig runtime_network = 20;
}

message SandboxInfo {
  string native_sandbox_id = 1;
  string product_sandbox_id = 2;
  string alias = 3;
  SandboxPhase phase = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  ResourceSpec actual_resources = 7;
  AccessDescriptor access = 8;
  map<string, string> extra = 9;
}

message OperationStatus {
  string operation_id = 1;
  string action = 2;
  string state = 3;
  string error_code = 4;
  string error_message = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  map<string, string> result = 8;
}

message CheckpointResult {
  string native_sandbox_id = 1;
  string snapshot_ref = 2;
  bool published = 3;
  bool captures_memory = 4;
  bool captures_rootfs = 5;
  bool captures_volumes = 6;
  bool captures_attached_drives = 7;
  SandboxPhase source_phase = 8;
  map<string, string> compatibility = 9;
}

message SandboxRuntimeInfo {
  string native_sandbox_id = 1;
  string product_sandbox_id = 2;
  SandboxPhase phase = 3;
  string vm_state = 4;
  string netns_path = 5;
  repeated HostPort hostports = 6;
  repeated OperationStatus active_operations = 7;
  map<string, string> network = 8;
  map<string, string> storage = 9;
  map<string, string> versions = 10;
  map<string, string> extra = 11;
}

message HostPort {
  uint32 host_port = 1;
  uint32 sandbox_port = 2;
}

message SandboxCreateRequest {
  string operation_id = 1;
  // 规范化请求的 SHA-256，固定 32 字节。
  bytes request_fingerprint = 2;
  SandboxSpec spec = 3;
  uint64 timeout_seconds = 4;
}

message SandboxCreateResponse {
  SandboxInfo sandbox = 1;
  OperationStatus operation = 2;
}

message SandboxGetRequest {
  string native_sandbox_id = 1;
}

message SandboxListRequest {
  // 为空表示不按产品 ID 过滤。
  string product_sandbox_id = 1;
  // 是否包含 Paused sandbox，默认 false。
  bool include_paused = 2;
}

message SandboxListResponse {
  repeated SandboxInfo sandboxes = 1;
}

message SandboxUpdateRequest {
  string native_sandbox_id = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  NetworkPolicy egress = 3;
}

message SandboxDeleteRequest {
  string operation_id = 1;
  string native_sandbox_id = 2;
  uint64 timeout_seconds = 3;
}

message SandboxPauseRequest {
  string operation_id = 1;
  string native_sandbox_id = 2;
  uint64 timeout_seconds = 3;
}

message SandboxPauseResponse {
  SandboxInfo sandbox = 1;
  OperationStatus operation = 2;
}

message SandboxResumeRequest {
  string native_sandbox_id = 1;
  // Resume 的 TTL；0 表示保留原 TTL。
  uint64 timeout_seconds = 2;
  // 仅供内部/原生客户端使用；控制面 Resume 不依赖该字段。
  string operation_id = 3;
}

message SandboxResumeResponse {
  SandboxInfo sandbox = 1;
  OperationStatus operation = 2;
}

message SandboxCheckpointRequest {
  string operation_id = 1;
  string native_sandbox_id = 2;
  uint64 timeout_seconds = 3;
  map<string, string> metadata = 4;
}

message SandboxGetRuntimeRequest {
  string native_sandbox_id = 1;
}

message SandboxOperationGetRequest {
  string operation_id = 1;
}

message SandboxCapabilities {
  string runtime_contract_version = 1;
  bool pause = 2;
  bool resume = 3;
  bool checkpoint = 4;
  bool template_source = 5;
  bool image_source = 6;
  bool volume_mounts = 7;
  bool attached_drives = 8;
  reserved 9, 10, 11, 12;
  reserved "exec_sync", "process_control", "stats", "recovery_remediation";
}

service SandboxLifecycleService {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Get(SandboxGetRequest) returns (SandboxInfo);
  rpc List(SandboxListRequest) returns (SandboxListResponse);
  rpc Update(SandboxUpdateRequest) returns (SandboxInfo);
  rpc Delete(SandboxDeleteRequest) returns (OperationStatus);
}

service SandboxAdminService {
  rpc Pause(SandboxPauseRequest) returns (SandboxPauseResponse);
  // 仅供新仓内部或原生客户端；KASandbox 控制面使用原生 REST Resume。
  rpc Resume(SandboxResumeRequest) returns (SandboxResumeResponse);
  rpc Checkpoint(SandboxCheckpointRequest) returns (CheckpointResult);
  // 仅供节点管理面使用；不进入 KASandbox 公共 Admin v2。
  rpc GetRuntime(SandboxGetRuntimeRequest) returns (SandboxRuntimeInfo);
  rpc GetOperation(SandboxOperationGetRequest) returns (OperationStatus);
  rpc Capabilities(google.protobuf.Empty) returns (SandboxCapabilities);
}
