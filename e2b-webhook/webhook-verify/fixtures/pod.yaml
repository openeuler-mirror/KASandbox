# webhook-verify Pod 模板
#
# 占位符（由 lib/k8s.sh:k8s_render 填充；渲染后空行被删除，因此可选块传空串
# 即可整块消失——这是“不写 runtimeClassName / annotations”的关键）：
#   NAME            Pod 名
#   NS              namespace
#   LABELS          "  labels:\n    key: \"0\""，可为空
#   ANNOTATIONS     "  annotations:\n    a: \"b\""，可为空
#   RUNTIMECLASS    "  runtimeClassName: e2b"，可为空
#   IMAGE           容器镜像
#   COMMAND         JSON 数组形式的 command
#   ENV             "        - name: TEMPLATE_NAME\n          value: \"x\""，可为空
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: __NS__
__LABELS__
__ANNOTATIONS__
spec:
  restartPolicy: Never
__RUNTIMECLASS__
  containers:
    - name: sandbox
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: __COMMAND__
      env:
__ENV__
